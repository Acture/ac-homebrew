name: Publish existing release to Nexus

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published GitHub Release tag (X.Y.Z or vX.Y.Z)
        required: true
        type: string
      publish:
        description: Upload after validation and environment approval (otherwise preview only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: nexus-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate the published ZIP and upload wording
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require the trusted default-branch workflow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Run this workflow from the default branch."
            exit 1
          fi
      - name: Require configured environment reviewers before requesting upload
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/nexus-publish" |
            python scripts/prepare_nexus_release.py check-environment
      - name: Read the published release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p artifacts/nexus-download
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > artifacts/nexus-release.json
      - name: Select one exact uploaded asset and its GitHub digest
        id: asset
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python scripts/prepare_nexus_release.py metadata \
            --metadata artifacts/nexus-release.json \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"
      - name: Read source files from the same release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          path: release-source
          persist-credentials: false
      - name: Download the exact release asset ID
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ steps.asset.outputs.asset_id }}
          FILENAME: ${{ steps.asset.outputs.filename }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            -H "Accept: application/octet-stream" > "artifacts/nexus-download/$FILENAME"
      - name: Verify the ZIP against its digest and tagged delivery sources
        id: package
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          FILENAME: ${{ steps.asset.outputs.filename }}
        run: |
          python scripts/prepare_nexus_release.py prepare \
            --metadata artifacts/nexus-release.json \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" \
            --source-root release-source --package "artifacts/nexus-download/$FILENAME" \
            --output-directory artifacts/nexus-ready \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Preserve the exact checked ZIP and upload manifest for this run
        uses: actions/upload-artifact@v7
        with:
          name: nexus-release-${{ github.run_id }}
          path: artifacts/nexus-ready/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  upload:
    name: Upload the approved ZIP to Nexus
    if: ${{ inputs.publish }}
    needs: prepare
    environment: nexus-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nexus-release-${{ github.run_id }}
          path: artifacts/nexus-ready
      - name: Recheck the prepared ZIP before exposing the Nexus key
        id: inputs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREPARED_SHA256: ${{ needs.prepare.outputs.sha256 }}
        run: |
          python scripts/prepare_nexus_release.py upload-inputs \
            --directory artifacts/nexus-ready \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" \
            --sha256 "$PREPARED_SHA256" --github-output "$GITHUB_OUTPUT"
      - name: Require environment publishing configuration
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          NEXUSMODS_FILE_ID: ${{ vars.NEXUSMODS_FILE_ID }}
          NEXUSMODS_MOD_ID: ${{ vars.NEXUSMODS_MOD_ID }}
        run: |
          for name in NEXUSMODS_API_KEY NEXUSMODS_FILE_ID NEXUSMODS_MOD_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name on the nexus-publish environment."
              exit 1
            fi
          done
      - name: Upload a new version and its reviewed bilingual changelog
        id: nexus
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
          filename: ${{ steps.inputs.outputs.package_path }}
          version: ${{ steps.inputs.outputs.version }}
          display_name: AC's Homebrew ${{ steps.inputs.outputs.version }}
          description: ${{ steps.inputs.outputs.changelog }}
          changelog: ${{ steps.inputs.outputs.changelog }}
          category: main
          archive_existing_version: 'false'
          update_mod_version: 'true'
      - name: Record a created Nexus version even if the changelog step failed
        if: ${{ always() && steps.nexus.outputs.version_id != '' }}
        env:
          VERSION_ID: ${{ steps.nexus.outputs.version_id }}
          UPLOAD_OUTCOME: ${{ steps.nexus.outcome }}
        run: |
          {
            echo "## Nexus file version created"
            echo
            echo "Version ID: $VERSION_ID"
            echo
            echo "Upload action outcome: $UPLOAD_OUTCOME"
            echo
            echo "Check Nexus before retrying: the file may exist even if adding its changelog failed."
          } >> "$GITHUB_STEP_SUMMARY"
