name: Draft release from version tag

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  draft:
    name: Check the tag and create a draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $GITHUB_REF_NAME is not on $DEFAULT_BRANCH. Merge first, then tag."
            exit 1
          fi
      - name: Check versions and player materials, then write bilingual notes
        id: notes
        run: |
          mkdir -p artifacts
          python scripts/draft_release.py --tag "$GITHUB_REF_NAME" \
            --notes-file artifacts/release-notes.md --github-output "$GITHUB_OUTPUT"
      - name: Create the draft unless a release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$TITLE" --notes-file artifacts/release-notes.md
          {
            echo "## Draft created: $TITLE"
            echo
            echo "Upload the locally built and checked ZIP, review the notes, then publish."
            echo "Publishing starts the Nexus workflow, which still waits for environment approval."
          } >> "$GITHUB_STEP_SUMMARY"
